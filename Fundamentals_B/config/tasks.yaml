research_task:
  description: >
    Use the SerperDevTool to find the most relevant and 
    recent data on {topic}.
  agent: research_agent
  expected_output: >
    A detailed research report with key insights and 
    source references. Researched multiple blogs, publications, 
    research papers, articles, and other sources 
    to find real-time information about the topic."

  verbose: true

summarization_task:
  description: >
    Summarize the research findings into a well-structured, 
    concise report.
  agent: summarization_agent
  expected_output: >
    A summary highlighting the key takeaways from the research.
    It should be like the major bullet points, factors affecting 
    the final output. Like building blocks building the final product.

  verbose: true
  depends_on: research_task

fact_checking_task:
  description: >
    Cross-check the summarized information for accuracy and 
    remove any misleading claims.
  agent: fact_checker_agent
  expected_output: >
    A fact-checked and verified research summary.
  verbose: true
  depends_on: summarization_task

content_writing_task:
  description: >
    Using the research brief provided, create an engaging blog post that: 
    1. Transforms technical information into accessible content 
    2. Maintains all factual accuracy and citations from the research 
    3. Includes: 
      - Attention-grabbing introduction 
      - Well-structured body sections with clear headings 
      - Compelling conclusion 
    4. Preserves all source citations in [Source: URL] format
    5. Includes a References section at the end
  agent: content_writer_agent
  expected_output: >
    A polished blog post in markdown format that: 
    - Engages readers while maintaining accuracy 
    - Contains properly structured sections 
    - Includes inline citations hyperlinked to the original source url 
    - Flow chart or mind map showing the entire execution strategy beginning to end
    - Presents information in an accessible yet informative way
    - Follows proper markdown formatting, use H1 for the title and H3 for the sub-sections.
  depends_on: fact_checking_task
